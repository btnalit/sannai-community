[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sannai-community"
version = "0.1.0"
description = "Governed multi-partner roster and community feature layer, extracted from Hermes-Memory-OS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["sannai_community*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
